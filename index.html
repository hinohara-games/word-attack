let sheets={},fileName='',unit='ALL',pageFrom='',pageTo='',activeData=defaultData.slice(),selectedSpeed=1,voiceRate=1,selectedVoice='',audioEnabled=true;

let running=false,paused=false,bossActive=false,bossLocked=false,queue=[],lanes=[null,null,null],selected=-1,score=0,combo=0,elapsed=0,mistakes=[],stats=new Map(),bossWords=[],bossY=0,bossRetries=0,raf=0,last=0,secondAccum=0,epoch=0,missCount=0,hintUsed=false,toastTimer=0;

function unlockMobileAudio(){
 if(!audioEnabled)return;
 try{
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioClass)return;
  ctx=ctx||new AudioClass();

   const result=ctx.resume();
   if(result&&typeof result.catch==='function')result.catch(()=>{});
  }

  const buffer=ctx.createBuffer(1,1,22050);

 }catch(e){console.warn('Audio unlock:',e)}
}

let ctx=null;let bossBeat=0,bossMusicClock=0;function bossMusic(dt){if(!audioEnabled||!bossActive||bossLocked||paused||('speechSynthesis'in window&&speechSynthesis.speaking))return;bossMusicClock+=dt;if(bossMusicClock<490)return;bossMusicClock=0;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')return;const notes=[110,116.54,130.81,113.1,155.56,123.47],o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='triangle';o.frequency.value=notes[bossBeat++%notes.length];g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.055,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.36);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.38)}catch(e){}}function sound(kind){if(!audioEnabled)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();if(kind==='earthFail'){const t=ctx.currentTime;[[175,110,0,.32],[130,58,.25,.55]].forEach(([from,to,delay,dur])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(from,t+delay);o.frequency.exponentialRampToValueAtTime(to,t+delay+dur);g.gain.setValueAtTime(.0001,t+delay);g.gain.linearRampToValueAtTime(.20,t+delay+.025);g.gain.exponentialRampToValueAtTime(.0001,t+delay+dur);o.connect(g);g.connect(ctx.destination);o.start(t+delay);o.stop(t+delay+dur+.02)});return;}const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;const cfg={laser:[230,900,.15,'square',.085],boom:[500,65,.27,'sawtooth',.18],miss:[190,60,.32,'sawtooth',.13],tap:[500,680,.055,'sine',.04],boss:[120,43,.7,'sawtooth',.22]}[kind]||[440,700,.12,'sine',.08];o.type=cfg[3];o.frequency.setValueAtTime(cfg[0],t);o.frequency.exponentialRampToValueAtTime(cfg[1],t+cfg[2]);g.gain.setValueAtTime(cfg[4],t);g.gain.exponentialRampToValueAtTime(.001,t+cfg[2]);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+cfg[2]+.02)}catch(e){}}

function renderStart(){overlay.style.display='flex';panel.innerHTML=`<h1>🌍 WORD ATTACK</h1><div class="subtitle">Save the Earth with English!</div><p>3レーンから落下する日本語をタップし、正しい英単語を4択から選んで地球を守ろう！</p><button class="primary" id="start">🚀 ゲームスタート</button><p class="notice">設定を変更する場合は下へスクロール ↓</p><div class="group"><label>📊 Excel単語ファイルを選択（.xlsx / .xls）<input type="file" id="excel" accept=".xlsx,.xls" style="width:100%;margin-top:8px"></label><p id="fileLabel" class="notice">${fileName?'使用中：'+esc(fileName):'未選択：サンプル20語で遊べます'}</p><div id="filters" style="${Object.keys(sheets).length?'':'display:none'}"><label>ユニット（シート）<select id="unit">${unitOptions()}</select></label><div style="display:flex;gap:8px"><label style="flex:1">開始ページ<input type="number" id="from" value="${esc(pageFrom)}" placeholder="指定なし"></label><label style="flex:1">終了ページ<input type="number" id="to" value="${esc(pageTo)}" placeholder="指定なし"></label></div></div><p id="count">${activeData.length} 語</p></div><div class="group"><label>落下スピード（5段階）</label><div class="speedrow">${[1,2,3,4,5].map(n=>`<button data-speed="${n}" class="${n===selectedSpeed?'sel':''}">${n}</button>`).join('')}</div><label>🔊 英語音声 ${voiceSelect()}</label><label>読み上げ速度 <select id="voiceRate"><option value="0.88" ${voiceRate===.88?'selected':''}>ゆっくり</option><option value="1" ${voiceRate===1?'selected':''}>標準</option><option value="1.1" ${voiceRate===1.1?'selected':''}>少し速い</option></select></label><label><input type="checkbox" id="audio" ${audioEnabled?'checked':''}> 音声・効果音・BGMを使用</label><button class="secondary" id="testVoice">▶ 英語音声テスト</button></div><p class="notice">操作：日本語をタップ → 4択をタップ。選択中の日本語をもう一度タップすると発音ヒント（1回5点、何度でも利用可）。時間が経つと誤答が2つまで消えます。ボス戦では3語を撃破！</p><p class="copyright">© 2026 Hinohara. All rights reserved.<br>非営利目的の無償利用・無償配布可。営利再配布・改変版公開には制作者の許可が必要です。</p>`;

async function loadExcel(e){let file=e.target.files[0];if(!file)return;try{if(typeof XLSX==='undefined')throw Error('Excel読込ライブラリを読み込めません。ネット接続をご確認ください');const book=XLSX.read(await file.arrayBuffer(),{type:'array'}),newSheets={};for(const name of book.SheetNames){const rows=XLSX.utils.sheet_to_json(book.Sheets[name],{header:1});let header=-1,jp=-1,en=-1,page=-1;for(let r=0;r<Math.min(15,rows.length);r++){const row=rows[r]||[];const vals=row.map(v=>String(v??'').trim());let j=vals.indexOf('意味'),a=vals.indexOf('単語');if(a<0)a=vals.indexOf('記入欄1');if(j>=0&&a>=0){header=r;jp=j;en=a;page=vals.indexOf('p.');if(page<0)page=vals.indexOf('ページ');break}}if(header<0)continue;let items=[];for(let r=header+1;r<rows.length;r++){let row=rows[r]||[],j=String(row[jp]??'').trim(),a=String(row[en]??'').trim(),p=page>=0?parseInt(row[page],10)||0:0;if(j&&a&&clean(a))items.push([j,a,p])}if(items.length)newSheets[name]=items}if(!Object.keys(newSheets).length)throw Error('「意味」「単語」または「記入欄1」の列が見つかりません');sheets=newSheets;fileName=file.name;unit='ALL';pageFrom='';pageTo='';activeData=defaultData.slice();renderStart();applyFilters()}catch(err){alert('Excelの読み込みに失敗しました：'+err.message)}}
function applyFilters(){unit=$('unit')?.value||'ALL';pageFrom=$('from')?.value||'';pageTo=$('to')?.value||'';if(!Object.keys(sheets).length){activeData=defaultData.slice();return}const f=pageFrom===''?null:+pageFrom,t=pageTo===''?null:+pageTo;activeData=Object.entries(sheets).filter(([name])=>unit==='ALL'||name===unit).flatMap(([,items])=>items).filter(item=>(f===null||item[2]>=f)&&(t===null||item[2]<=t));$('count').textContent=activeData.length?`${activeData.length} 語が対象です`:'⚠ 条件に合う単語がありません';$('start').disabled=!activeData.length}
function keyOf(item){return item[0]+'|'+clean(item[1])}function record(item,wrong){let k=keyOf(item),s=stats.get(k)||{item,errors:0,total:0,tries:0};if(wrong)s.errors++;else s.tries++;stats.set(k,s)}
function addMistake(item,reason){mistakes.push({jp:item[0],en:item[1],reason});record(item,true);missCount++}
function updateHUD(){$('score').textContent=score;$('combo').textContent=combo;$('time').textContent=elapsed;$('remaining').textContent=bossActive?bossWords.filter(w=>!w.done).length:queue.length+lanes.filter(Boolean).length}
function toast(s){$('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',850)}
function validOptions(item){const correct=clean(item[1]);const candidates=shuffle([...new Map(activeData.filter(x=>clean(x[1])!==correct).map(x=>[clean(x[1]),x[1]])).values()]);const chosen=candidates.slice(0,3); // small Excel sets may have fewer than 4 unique answers
return shuffle([item[1],...chosen]).map((en,i)=>({en,correct:clean(en)===correct,id:i}))}
function playWordHint(item){if(!running||paused||!item)return;unlockMobileAudio();score=Math.max(0,score-HINT_PENALTY);hintUsed=true;updateHUD();speak(item[1]);toast('🔊 発音ヒント −'+HINT_PENALTY+'点')}
function setSelected(i){if(!running||paused||bossActive)return;let l=lanes[i];if(!l||l.firing)return;if(selected===i){playWordHint(l.item);return}selected=i;document.querySelectorAll('.target').forEach((el,k)=>el.classList.toggle('selected',k===i));$('barrel').style.transform=`rotate(${[-42,0,42][i]}deg)`;sound('tap');drawChoices()}
function drawChoices(){if(bossActive){drawBossChoices();return}let l=lanes[selected];if(!l||l.firing){choices.innerHTML='<button disabled>日本語を</button><button disabled>タップして</button><button disabled>ターゲットを</button><button disabled>選択</button>';$('instruction').textContent='落下する日本語をタップして狙おう！';return}let opts=l.options;choices.innerHTML=opts.map((o,i)=>`<button data-i="${i}" ${l.hidden.has(i)?'disabled':''}>${l.hidden.has(i)?'—':esc(o.en)}</button>`).join('');$('instruction').textContent=`「${l.item[0]}」の英語はどれ？`;choices.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>answerLane(+b.dataset.i))}
function spawn(i,autoSelect=false){if(!running||bossActive)return;let el=document.querySelector(`.target[data-lane="${i}"]`);if(!queue.length){lanes[i]=null;el.textContent='';if(selected===i){selected=-1;drawChoices()}updateHUD();checkCompletion();return}let item=queue.shift(),opts=validOptions(item);lanes[i]={item,options:opts,hidden:new Set(),y:6,rate:speeds[selectedSpeed-1]*Math.max(.48,1-Math.max(0,clean(item[1]).length-5)*.07),firing:false,wrong:false};el.textContent=item[0];el.style.top='6px';el.classList.remove('firing','selected');if(selected===-1&&autoSelect)setSelected(i);else drawChoices();updateHUD()}
function wrongLane(l){if(l.wrong)return;l.wrong=true;combo=0;addMistake(l.item,'4択で誤答');updateHUD();sound('miss');toast('MISS!'); // keep the current word for another attempt
}
function answerLane(i){let l=lanes[selected];if(!running||paused||!l||l.firing||l.hidden.has(i))return;let o=l.options[i];if(!o)return;if(o.correct){let laneIndex=selected;l.firing=true;document.querySelectorAll('.target').forEach(el=>el.classList.remove('selected'));document.querySelector(`.target[data-lane="${laneIndex}"]`).classList.add('firing');score+=10+Math.min((++combo)*2,20);record(l.item,false);updateHUD();speak(l.item[1]);sound('laser');fireAt(laneIndex,l,()=>{if(lanes[laneIndex]!==l)return;lanes[laneIndex]=null;document.querySelector(`.target[data-lane="${laneIndex}"]`).textContent='';selected=-1;spawn(laneIndex,false);document.querySelectorAll('.target').forEach(el=>el.classList.remove('selected'));drawChoices();checkCompletion()})}else{let b=choices.querySelector(`[data-i="${i}"]`);b?.classList.add('wrong');wrongLane(l);setTimeout(()=>{if(running&&!bossActive&&lanes[selected]===l)drawChoices()},350)}}
function laser(x1,y1,x2,y2){const el=document.createElement('div');el.className='laser';el.style.left=x1+'px';el.style.top=y1+'px';el.style.width=Math.hypot(x2-x1,y2-y1)+'px';el.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)}rad)`;$('effects').appendChild(el);return el}
function boom(x,y,successful=true){let el=document.createElement('div');el.className='boom';el.style.left=x-9+'px';el.style.top=y-9+'px';$('effects').appendChild(el);setTimeout(()=>el.remove(),520);if(successful)sound('boom')}
function fireAt(i,l,done){let target=document.querySelector(`.target[data-lane="${i}"]`),r=target.getBoundingClientRect(),ar=arena.getBoundingClientRect(),c=$('barrel').getBoundingClientRect(),x1=c.left+c.width/2-ar.left,y1=c.top-ar.top,x2=r.left+r.width/2-ar.left,y2=r.top+r.height/2-ar.top;let beam=laser(x1,y1,x2,y2),e=epoch;setTimeout(()=>{beam.remove();if(!running||epoch!==e)return;boom(x2,y2);toast('🎯 HIT!');done()},260)}
function hideHints(l){if(!l||l.firing)return;const non=l.options.map((o,i)=>!o.correct&&!l.hidden.has(i)?i:-1).filter(i=>i>=0);if(non.length<=1)return;let toHide=non[Math.floor(Math.random()*non.length)];l.hidden.add(toHide);if(lanes[selected]===l)drawChoices()}
function impact(i,l){let target=document.querySelector(`.target[data-lane="${i}"]`),r=target.getBoundingClientRect(),a=arena.getBoundingClientRect();boom(r.left+r.width/2-a.left,arena.clientHeight-65,false);sound('earthFail');addMistake(l.item,'落下・未回答');combo=0;toast('EARTH HIT!');queue.splice(Math.min(2+Math.floor(Math.random()*3),queue.length),0,l.item);lanes[i]=null;target.textContent='';if(selected===i)selected=-1;document.querySelectorAll('.target').forEach(el=>el.classList.remove('selected'));spawn(i,false);drawChoices();updateHUD()}
function playVictoryMusic(){if(!audioEnabled)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const notes=[[523.25,0,.14],[659.25,.15,.14],[783.99,.30,.15],[1046.5,.47,.25],[783.99,.75,.13],[1046.5,.91,.40]];notes.forEach(([f,delay,duration])=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),t=now+delay;osc.type='triangle';osc.frequency.setValueAtTime(f,t);gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.12,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.03)})}catch(e){}}
function checkCompletion(){if(running&&!bossActive&&queue.length===0&&lanes.every(x=>x===null))startBoss()}
function bossPick(){let pool=[...new Map(activeData.map(item=>[keyOf(item),item])).values()];return pool.sort((a,b)=>(stats.get(keyOf(b))?.errors||0)-(stats.get(keyOf(a))?.errors||0)).slice(0,3).map(item=>({item,done:false,options:validOptions(item),hidden:new Set(),wrong:false}))}
function startBoss(){bossBeat=0;bossMusicClock=0;bossActive=true;bossLocked=false;bossWords=bossPick();bossY=5;selectedBoss=bossWords.length-1;selected=-1;document.querySelectorAll('.target').forEach(el=>el.textContent='');bossEl.style.display='block';$('barrel').style.transform='rotate(0deg)';toast('☠ BOSS BATTLE!');renderBoss();drawBossChoices();updateHUD()}
function renderBoss(){bossEl.style.top=bossY+'px';bossEl.innerHTML=`<div class="bossTitle">⚠ BOSS APPROACHING!</div>${bossWords.map((w,i)=>w.done?'':`<button class="bossWord" data-boss="${i}">${esc(w.item[0])}</button>`).join('')}`;bossEl.querySelectorAll('[data-boss]').forEach(b=>b.onclick=()=>selectBoss(+b.dataset.boss))}
let selectedBoss=0;
function selectBoss(i){if(bossLocked||bossWords[i]?.done)return;if(selectedBoss===i){playWordHint(bossWords[i].item);return}selectedBoss=i;bossEl.querySelectorAll('.bossWord').forEach(el=>el.style.borderColor=+el.dataset.boss===i?'#ffd34d':'#a5c6ed');sound('tap');drawBossChoices()}
function drawBossChoices(){let w=bossWords[selectedBoss];if(!w||w.done){selectedBoss=bossWords.map((x,i)=>x.done?-1:i).filter(i=>i>=0).pop();w=bossWords[selectedBoss]}if(!w){choices.innerHTML='';return}choices.innerHTML=w.options.map((o,i)=>`<button data-i="${i}" ${w.hidden.has(i)||bossLocked?'disabled':''}>${w.hidden.has(i)?'—':esc(o.en)}</button>`).join('');$('instruction').textContent=`BOSS：「${w.item[0]}」を撃破せよ！`;choices.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answerBoss(+b.dataset.i));bossEl.querySelectorAll('.bossWord').forEach(el=>el.style.borderColor=+el.dataset.boss===selectedBoss?'#ffd34d':'#a5c6ed')}
function answerBoss(i){if(!running||paused||bossLocked)return;let w=bossWords[selectedBoss],o=w?.options[i];if(!w||!o||w.hidden.has(i))return;if(!o.correct){let b=choices.querySelector(`[data-i="${i}"]`);b?.classList.add('wrong');if(!w.wrong){w.wrong=true;addMistake(w.item,'ボス戦で誤答');combo=0}sound('miss');toast('MISS!');return}bossLocked=true;w.done=true;score+=30;combo++;record(w.item,false);updateHUD();speak(w.item[1]);sound('laser');let rect=bossEl.querySelector(`.bossWord[data-boss="${selectedBoss}"]`).getBoundingClientRect(),ar=arena.getBoundingClientRect(),c=$('barrel').getBoundingClientRect(),x=c.left+c.width/2-ar.left,y=c.top-ar.top,tx=rect.left+rect.width/2-ar.left,ty=rect.top+rect.height/2-ar.top,beam=laser(x,y,tx,ty),e=epoch;setTimeout(()=>{beam.remove();if(!running||e!==epoch)return;boom(tx,ty);renderBoss();if(bossWords.every(v=>v.done)){playVictoryMusic();toast('BOSS DEFEATED!');setTimeout(()=>{if(e===epoch)endGame(true)},950)}else{bossLocked=false;selectedBoss=bossWords.map((v,i)=>v.done?-1:i).filter(i=>i>=0).pop();drawBossChoices()}},280)}
function bossEscape(){if(bossLocked)return;bossLocked=true;bossRetries++;sound('boss');bossWords.filter(w=>!w.done).forEach(w=>addMistake(w.item,'ボス逃走'));paused=true;showMenu(`<h1>☠ BOSS ESCAPED!</h1><p>残りの単語を撃破できませんでした。</p><p>${bossWords.map(w=>`${w.done?'✓':'✗'} ${esc(w.item[0])} — ${esc(w.item[1])}`).join('<br>')}</p><button class="primary" id="retryBoss">同じ3語で再挑戦</button><button class="secondary" id="quitBoss">結果を見る</button>`);$('retryBoss').onclick=()=>{bossWords.forEach(w=>{w.done=false;w.hidden.clear();w.wrong=false});bossLocked=false;selectedBoss=bossWords.length-1;bossY=5;paused=false;overlay.style.display='none';renderBoss();drawBossChoices();last=performance.now();loopStart()};$('quitBoss').onclick=()=>endGame(false)}
function loopStart(){cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function tick(now){if(!running||paused)return;if(!last)last=now;let dt=Math.min(50,now-last);last=now;secondAccum+=dt;bossMusic(dt);if(secondAccum>=1000){let n=Math.floor(secondAccum/1000);elapsed+=n;secondAccum-=n*1000;updateHUD()}if(bossActive){if(!bossLocked){bossY+=speeds[selectedSpeed-1]*dt*.75;bossEl.style.top=bossY+'px';if(bossY+bossEl.offsetHeight>arena.clientHeight-65){bossEscape();return}}}else{for(let i=0;i<3;i++){let l=lanes[i];if(!l||l.firing)continue;l.y+=l.rate*dt;let el=document.querySelector(`.target[data-lane="${i}"]`);el.style.top=l.y+'px';let progress=Math.min(1,l.y/Math.max(1,arena.clientHeight-145));let desired=progress>=.7?2:progress>=.38?1:0;while(l.hidden.size<desired){let before=l.hidden.size;hideHints(l);if(l.hidden.size===before)break}if(l.y+el.offsetHeight>=arena.clientHeight-66){impact(i,l)}}}raf=requestAnimationFrame(tick)}
function showMenu(html){overlay.style.display='flex';panel.innerHTML=html}
function pause(){if(!running||paused)return;paused=true;cancelAnimationFrame(raf);showMenu('<h1>⏸ PAUSED</h1><p>ゲームを一時停止しています。</p><button class="primary" id="resume">ゲームを再開</button><button class="secondary" id="quit">終了して結果を見る</button>');$('resume').onclick=()=>{paused=false;overlay.style.display='none';last=performance.now();loopStart()};$('quit').onclick=()=>endGame(false)}
function bestKey(){let text=activeData.map(x=>clean(x[1])).sort().join('|');let hash=2166136261;for(let c of text)hash=Math.imul(hash^c.charCodeAt(0),16777619);return 'wordAttackMobileBestV1:'+selectedSpeed+':'+(hash>>>0)}
function bestStats(clear){let key=bestKey(),v={time:null,score:null};try{v=JSON.parse(localStorage.getItem(key))||v}catch(e){}if(clear){v.time=v.time==null?elapsed:Math.min(v.time,elapsed);v.score=v.score==null?score:Math.max(v.score,score);try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}}return v}
function endGame(clear){if(!running)return;running=false;paused=false;epoch++;cancelAnimationFrame(raf);try{speechSynthesis.cancel()}catch(e){}let bonus=0,perfect=0;if(clear){bonus=Math.floor(1200*Math.max(1,activeData.length)/Math.max(1,elapsed));perfect=missCount===0&&bossRetries===0&&!hintUsed?300:0;score+=bonus+perfect}updateHUD();let best=bestStats(clear),uniq=[...new Map(mistakes.map(m=>[m.jp+'|'+m.en,m])).values()];showMenu(`<h1>${clear?'🏆 STAGE CLEAR!':'🛑 GAME OVER'}</h1><p>プレイ時間 ${elapsed} 秒　|　スコア ${score} 点</p>${clear?`<p>タイムボーナス +${bonus}　${perfect?'PERFECT BONUS +300':''}</p>`:''}<div class="group" style="text-align:center">🏆 最高スコア：${best.score??'記録なし'}<br>⏱ 最短クリア：${best.time==null?'記録なし':best.time+' 秒'}</div><p>今回間違えた単語（${uniq.length}語）</p><div class="mistakes">${uniq.length?uniq.map(m=>`<button data-say="${esc(m.en)}">${esc(m.jp)} — ${esc(m.en)} 🔊</button>`).join(''):'間違えた単語はありません！'}</div><p class="notice">使用範囲：${esc(fileName||'サンプル単語')} / ${esc(unit)}</p><button class="primary" id="again">同じ設定で再挑戦</button><button class="secondary" id="settings">設定・範囲を変更</button><p class="copyright">© 2026 Hinohara. All rights reserved.</p>`);panel.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));$('again').onclick=startGame;$('settings').onclick=renderStart}
function startGame(){unlockMobileAudio();if(!activeData.length)return;epoch++;try{speechSynthesis.cancel()}catch(e){}cancelAnimationFrame(raf);$('effects').innerHTML='';$('toast').textContent='';queue=shuffle(activeData.slice());lanes=[null,null,null];selected=-1;score=0;combo=0;elapsed=0;secondAccum=0;last=0;mistakes=[];stats=new Map();missCount=0;hintUsed=false;bossActive=false;bossLocked=false;bossRetries=0;bossWords=[];running=true;paused=false;bossEl.style.display='none';overlay.style.display='none';document.querySelectorAll('.target').forEach(el=>{el.textContent='';el.classList.remove('selected','firing')});for(let i=0;i<3;i++)spawn(i);setSelected(1);if(!lanes[1])setSelected(lanes.findIndex(Boolean));updateHUD();loopStart()}
document.querySelectorAll('.target').forEach(b=>b.addEventListener('click',()=>setSelected(+b.dataset.lane)));$('pauseBtn').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&running&&!paused)pause()});if('speechSynthesis'in window)speechSynthesis.addEventListener?.('voiceschanged',()=>{let el=$('voiceSelect');if(el&&overlay.style.display!=='none'){let old=el.value;el.innerHTML=voiceSelect().replace(/^<select[^>]*>|<\/select>$/g,'');el.value=old}});renderStart();
</script></body></html>
